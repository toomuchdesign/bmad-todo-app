name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  # Mirror .env.test — keep in sync if either is changed.
  WEB_PORT: 5174
  API_PORT: 3002
  API_HOST: 127.0.0.1
  WEB_ORIGIN: http://localhost:5174
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bmad_todo_test
  JWT_SECRET: test-jwt-secret

jobs:
  # Pre-build the `shared` workspace once and hand its dist/ to every
  # downstream job as an artifact. api/web consume `shared` via its
  # compiled entry (./dist/index.js + .d.ts), so without this step
  # tsc and vitest fail to resolve `import … from "shared"`.
  prepare:
    name: "Prepare"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci --ignore-scripts

      - name: Build shared package
        run: npm -w shared run build

      - uses: actions/upload-artifact@v7
        with:
          name: shared-dist
          path: packages/shared/dist
          retention-days: 1

  source-check:
    name: "Source check"
    needs: [prepare]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v8
        with:
          name: shared-dist
          path: packages/shared/dist

      - name: source:check
        run: npm run source:check

  unit-tests:
    name: "Unit tests"
    needs: [prepare]
    runs-on: ubuntu-latest

    services:
      # Matches the DATABASE_URL in .env.test — localhost:5432/bmad_todo_test.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bmad_todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v8
        with:
          name: shared-dist
          path: packages/shared/dist

      - name: Run database migrations
        run: npm run db:migrate:ci

      - name: test:ci
        run: npm run test:ci -- --coverage

      - uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: coverage

  e2e-tests:
    name: "E2E tests"
    needs: [prepare]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bmad_todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v8
        with:
          name: shared-dist
          path: packages/shared/dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run database migrations
        run: npm run db:migrate:ci

      - name: test:e2e
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            packages/web/e2e/playwright-report/
            packages/web/e2e/test-results/
          retention-days: 7

  build:
    name: "Build"
    needs: [prepare]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci --ignore-scripts

      # The root `build` script rebuilds `shared` too, so no artifact
      # download is needed here — this job is self-contained.
      - name: build
        run: npm run build

  upload-code-coverage:
    name: "Upload code coverage"
    needs: [unit-tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: code-coverage
          path: coverage

      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
